name: Build & Aqua Scan (Web Only)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # 1️⃣ Build only web service
      # -------------------------
      - name: Build Web Service
        run: |
          docker compose build web

      # -------------------------
      # 2️⃣ Install Billy
      # -------------------------
      - name: Install Billy
        run: |
          export BILLY_SERVER=https://billy.eu-1.codesec.aquasec.com

          curl -sLo install.sh https://download.codesec.aquasec.com/billy/install.sh
          curl -sLo install.sh.checksum https://github.com/argonsecurity/releases/latest/download/install.sh.checksum

          if ! sha256sum --check install.sh.checksum; then
            echo "install.sh checksum failed"
            exit 1
          fi

          BINDIR="." sh install.sh
          rm install.sh install.sh.checksum

      # -------------------------
      # 3️⃣ Scan Web Image
      # -------------------------
      - name: Scan Web Image
        run: |
          export BILLY_SERVER=https://billy.eu-1.codesec.aquasec.com

          ./billy generate \
            --access-token "${{ secrets.GITHUB_TOKEN }}" \
            --aqua-key "${{ secrets.AQUA_KEY }}" \
            --aqua-secret "${{ secrets.AQUA_SECRET }}" \
            --cspm-url https://eu-1.api.cloudsploit.com \
            --artifact-path "vulnbank-web:latest"

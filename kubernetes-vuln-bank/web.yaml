apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: vuln-bank
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-bank-web
  namespace: vuln-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vuln-bank-web
  template:
    metadata:
      labels:
        app: vuln-bank-web
    spec:
      initContainers:
        - name: init-uploads
          image: vuln-bank-web:latest
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'cp -rn /app/static/uploads/. /mnt/uploads/']
          volumeMounts:
            - name: uploads
              mountPath: /mnt/uploads
        - name: wait-for-postgres
          image: postgres:13
          command: ['sh', '-c', 'until pg_isready -h db -p 5432; do echo "waiting for postgres..."; sleep 2; done']
      containers:
        - name: web
          image: vuln-bank-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
          volumeMounts:
            - name: uploads
              mountPath: /app/static/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: vuln-bank-web
  namespace: vuln-bank
spec:
  type: ClusterIP
  selector:
    app: vuln-bank-web
  ports:
    - name: http
      port: 80
      targetPort: 5000

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vuln-bank-ingress
  namespace: vuln-bank
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vuln-bank-web
                port:
                  number: 80
